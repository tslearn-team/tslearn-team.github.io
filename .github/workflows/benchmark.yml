name: Benchmark

on:
  workflow_dispatch:

jobs:

  benchmark:

    permissions:
      contents: read
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
            python-version: "3.12"
        name: 'Setup python'
      - shell: bash
        run: |
          pip install pytest-benchmark[histogram]
        name: 'Install pytest-benchmark'
      - shell: bash
        run: |
          pip install tslearn[all_features]~=0.7.0 && pytest --benchmark-save=0.7 -k "test_dtw_numpy"
        name: 'Benchmark v0.7'
      - shell: bash
        run: |
          pip install tslearn[all_features]~=0.8.0 && pytest --benchmark-save=0.8 -k "test_dtw_numpy"
        name: 'Benchmark v0.8'
      - shell: bash
        run: |
          pip install tslearn[all_features]~=0.9.0 && pytest --benchmark-save=0.9 -k "test_dtw_numpy"
        name: 'Benchmark v0.9'
      - shell: bash
        run: |
          pip install 'tslearn[all_features] @ https://github.com/tslearn-team/tslearn/archive/main.zip' && pytest --benchmark-save=latest -k "test_dtw_numpy"
        name: 'Benchmark latest'
      - shell: bash
        run: |
          pytest-benchmark compare --group-by name --histogram benchmark
        name: 'Compare benchmark'
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # upload entire directory
          path: '.'
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v4